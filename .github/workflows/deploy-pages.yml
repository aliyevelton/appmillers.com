# Build Next.js static export and deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Set Pages artifact path
        id: pages-path
        run: |
          if [ -f out/${{ github.event.repository.name }}/index.html ]; then
            echo "path=out/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          else
            echo "path=out" >> $GITHUB_OUTPUT
          fi

      - name: Add .nojekyll to output
        run: touch ${{ steps.pages-path.outputs.path }}/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages-path.outputs.path }}

  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
